<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Neon Breaker</title>
  <style>
    :root{color-scheme:dark;--bg:#080516;--panel:#140d2b;--line:#412c70;--text:#f8f4ff;--muted:#b9abd8;--cyan:#51f6ff;--pink:#ff4fd8}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden;background:radial-gradient(circle at 50% 0,#26145b 0,var(--bg) 58%);color:var(--text);font:16px/1.4 system-ui,sans-serif}.shell{width:min(94vw,680px)}header{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:12px}h1{margin:0;font-size:clamp(1.4rem,4vw,2rem);letter-spacing:.08em;text-transform:uppercase;text-shadow:0 0 16px var(--pink)}.tagline{margin:2px 0 0;color:var(--muted);font-size:.9rem}.stats{display:flex;gap:18px;text-align:right}.stats span{display:block;color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.1em}.stats strong{display:block;font-size:1.25rem;color:var(--cyan)}.stage{position:relative;padding:10px;border:1px solid var(--line);border-radius:18px;background:rgba(15,8,34,.9);box-shadow:0 20px 70px #0008}canvas{display:block;width:100%;aspect-ratio:16/10;border-radius:11px;background:#070412;touch-action:none}.overlay{position:absolute;inset:10px;display:grid;place-items:center;padding:24px;border-radius:11px;background:#080412bb;text-align:center}.overlay[hidden]{display:none}.card{max-width:390px}.card h2{margin:0 0 8px;font-size:1.7rem;text-shadow:0 0 14px var(--cyan)}.card p{margin:6px 0;color:var(--muted)}button{margin-top:14px;padding:11px 22px;border:0;border-radius:999px;color:#10051d;background:var(--cyan);font:inherit;font-weight:800;cursor:pointer;box-shadow:0 0 20px #51f6ff99}button:hover{filter:brightness(1.1)}.help{margin:12px 3px 0;color:var(--muted);font-size:.86rem;text-align:center}kbd{padding:2px 6px;border:1px solid #5e4b8a;border-radius:4px;color:var(--text);background:#21143e}@media(max-width:500px){header{align-items:start;flex-direction:column}.stats{text-align:left}}
  </style>
</head>
<body>
  <main class="shell"><header><div><h1>Neon Breaker</h1><p class="tagline">Bounce the pulse. Break the grid.</p></div><div class="stats" aria-live="polite"><div><span>Score</span><strong id="score">0</strong></div><div><span>Lives</span><strong id="lives">3</strong></div><div><span>Best</span><strong id="best">0</strong></div></div></header>
    <section class="stage" aria-label="Neon Breaker game area"><canvas id="game" width="960" height="600"></canvas><div class="overlay" id="overlay"><div class="card"><h2 id="overlayTitle">Ready to break?</h2><p id="overlayText">Move the paddle, keep the energy ball alive, and clear every neon brick.</p><button id="startButton">Start game</button></div></div></section>
    <p class="help"><kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to move · Drag on touch screens · <kbd>R</kbd> to restart</p>
  </main>
  <script>
  (()=>{const c=document.querySelector('#game'),x=c.getContext('2d'),scoreEl=document.querySelector('#score'),livesEl=document.querySelector('#lives'),bestEl=document.querySelector('#best'),overlay=document.querySelector('#overlay'),title=document.querySelector('#overlayTitle'),text=document.querySelector('#overlayText'),start=document.querySelector('#startButton'),W=c.width,H=c.height,keys=new Set(),bricks=[],particles=[];const paddle={x:W/2,y:H-44,w:140,h:15,speed:760},ball={x:W/2,y:H-68,r:10,vx:320,vy:-390};let score=0,lives=3,best=Number(localStorage.getItem('neon-breaker-best')||0),running=false,last=0,level=1;bestEl.textContent=best;
  function makeBricks(){bricks.length=0;const rows=Math.min(7,5+level-1),cols=9,gap=10,bw=(W-100-gap*(cols-1))/cols;for(let r=0;r<rows;r++)for(let col=0;col<cols;col++)bricks.push({x:50+col*(bw+gap),y:70+r*32,w:bw,h:20,alive:true,color:['#ff4fd8','#b65cff','#51f6ff','#5cff9d'][r%4]})}function resetBall(){ball.x=W/2;ball.y=H-68;ball.vx=(Math.random()>.5?1:-1)*(280+level*20);ball.vy=-(390+level*15);paddle.x=W/2}function reset(){score=0;lives=3;level=1;scoreEl.textContent=0;livesEl.textContent=3;makeBricks();resetBall()}function begin(){reset();running=true;overlay.hidden=true;last=performance.now();requestAnimationFrame(loop)}function finish(won){running=false;if(score>best){best=score;localStorage.setItem('neon-breaker-best',best);bestEl.textContent=best}title.textContent=won?'Grid cleared!':'Ball lost';text.textContent=won?`You scored ${score}. The neon grid is yours.`:`Final score: ${score}. Keep the ball in play to beat your best.`;start.textContent='Play again';overlay.hidden=false}function burst(px,py,color){for(let i=0;i<12;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*260,vy:(Math.random()-.5)*260,life:.5,color})}function overlap(a,b){return a.x+a.r>b.x&&a.x-a.r<b.x+b.w&&a.y+a.r>b.y&&a.y-a.r<b.y+b.h}
  function update(dt){const dir=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('a')?1:0);paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,paddle.x+dir*paddle.speed*dt));let nx=ball.x+ball.vx*dt,ny=ball.y+ball.vy*dt;if(nx-ball.r<0||nx+ball.r>W){ball.vx*=-1;nx=ball.x+ball.vx*dt}if(ny-ball.r<0){ball.vy=Math.abs(ball.vy);ny=ball.y+ball.vy*dt}const pb={x:paddle.x-paddle.w/2,y:paddle.y,w:paddle.w,h:paddle.h};if(ball.vy>0&&overlap({x:nx,y:ny,r:ball.r},pb)){ball.vy=-Math.abs(ball.vy);ball.vx+=(nx-paddle.x)*3.4;ny=paddle.y-ball.r-1}for(const b of bricks)if(b.alive&&overlap({x:nx,y:ny,r:ball.r},b)){b.alive=false;score+=10;scoreEl.textContent=score;burst(nx,ny,b.color);ball.vy*=-1;break}ball.x=nx;ball.y=ny;if(ball.y-ball.r>H){lives--;livesEl.textContent=lives;if(lives<=0){finish(false);return}resetBall()}if(bricks.every(b=>!b.alive)){level++;makeBricks();resetBall()}for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}while(particles.length&&particles[0].life<=0)particles.shift()}
  function draw(){x.fillStyle='#070412';x.fillRect(0,0,W,H);x.strokeStyle='#21143e';x.lineWidth=1;for(let i=0;i<W;i+=48){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let i=0;i<H;i+=48){x.beginPath();x.moveTo(0,i);x.lineTo(W,i);x.stroke()}for(const b of bricks)if(b.alive){x.fillStyle=b.color;x.shadowColor=b.color;x.shadowBlur=15;x.fillRect(b.x,b.y,b.w,b.h);x.shadowBlur=0;x.fillStyle='#fff8';x.fillRect(b.x+4,b.y+3,b.w-8,3)}x.fillStyle='#51f6ff';x.shadowColor='#51f6ff';x.shadowBlur=22;x.fillRect(paddle.x-paddle.w/2,paddle.y,paddle.w,paddle.h);x.beginPath();x.arc(ball.x,ball.y,ball.r,0,Math.PI*2);x.fill();x.shadowBlur=0;for(const p of particles){x.globalAlpha=Math.max(0,p.life*2);x.fillStyle=p.color;x.fillRect(p.x-3,p.y-3,6,6)}x.globalAlpha=1}
  function loop(now){if(!running){draw();return}const dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();if(running)requestAnimationFrame(loop)}window.addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(['arrowleft','arrowright','a','d','r',' '].includes(k))e.preventDefault();if(k==='r')begin();else keys.add(k)});window.addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));c.addEventListener('pointermove',e=>{if(!running)return;const r=c.getBoundingClientRect();paddle.x=Math.max(paddle.w/2,Math.min(W-paddle.w/2,(e.clientX-r.left)*W/r.width))});start.addEventListener('click',begin);makeBricks();draw()})();
  </script>
</body>
</html>
